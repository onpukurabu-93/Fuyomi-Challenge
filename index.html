<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>音符フラッシュカード</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px 15px;
      color: #333;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    /* メニュー画面のスタイル */
    .menu-screen {
      max-width: 340px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .menu-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }
    .menu-card h2 {
      font-size: 16px;
      margin: 0 0 10px 0;
      color: #2d3748;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .btn {
      background: #edf2f7;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      padding: 10px 5px;
      font-size: 14px;
      font-weight: bold;
      color: #2d3748;
      cursor: pointer;
    }
    .btn:active {
      background: #cbd5e0;
    }
    .btn-main {
      grid-column: span 4;
      background: #4299e1;
      color: white;
      border: none;
      font-size: 16px;
      padding: 12px;
    }
    .btn-main:active {
      background: #3182ce;
    }

    /* スタート画面・ゲーム画面共通 */
    .game-screen {
      display: none;
    }
    .back-btn {
      display: inline-block;
      margin-bottom: 10px;
      background: #e2e8f0;
      border: none;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: bold;
      color: #4a5568;
      cursor: pointer;
    }

    /* レベルスタート表紙のスタイル */
    .start-wrapper {
      margin: 10px auto;
      max-width: 340px;
      height: 480px;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      cursor: pointer;
    }
    .start-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .level-num-overlay {
      position: absolute;
      top: 31%; /* イラストの白いもくもくの位置に調整 */
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 80px;
      font-weight: 900;
      color: #ff6b6b;
      text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff;
    }
    .start-tap-hint {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      color: #2b6cb0;
      background: rgba(255, 255, 255, 0.85);
      padding: 8px 0;
    }

    /* フラッシュカードのスタイル */
    .card-wrapper {
      margin: 10px auto;
      max-width: 340px;
      height: 440px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
      border: 2px solid #e2e8f0;
      touch-action: none;
      cursor: pointer;
    }
    .image-container {
      width: 100%;
      height: 100%;
      position: relative;
      background-color: #fff;
    }
    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .cover-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 32%;
      background-color: #edf2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: #4a5568;
      font-size: 16px;
      border-top: 2px dashed #cbd5e0;
      transition: opacity 0.2s ease;
      box-sizing: border-box;
      padding: 10px;
    }
    .cover-overlay.revealed {
      opacity: 0;
      pointer-events: none;
    }
    .swipe-hint {
      font-size: 13px;
      color: #718096;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <h1>🎵 音符フラッシュカード</h1>

  <!-- メニュー画面 -->
  <div id="menu-screen" class="menu-screen">
    
    <!-- はじめに -->
    <div class="menu-card">
      <h2>🔰 はじめに</h2>
      <button class="btn btn-main" onclick="startCourse('intro')">1つのド（中央のド）</button>
    </div>

    <!-- ト音記号 -->
    <div class="menu-card">
      <h2>🎼 ト音記号</h2>
      <div class="btn-grid">
        <button class="btn" onclick="startCourse('treble', 1)">Lv.1</button>
        <button class="btn" onclick="startCourse('treble', 2)">Lv.2</button>
        <button class="btn" onclick="startCourse('treble', 3)">Lv.3</button>
        <button class="btn" onclick="startCourse('treble', 4)">Lv.4</button>
        <button class="btn" onclick="startCourse('treble', 5)">Lv.5</button>
        <button class="btn" onclick="startCourse('treble', 6)">Lv.6</button>
        <button class="btn" onclick="startCourse('treble', 7)">Lv.7</button>
        <button class="btn" onclick="startCourse('treble', 8)">Lv.8</button>
      </div>
    </div>

    <!-- ヘ音記号 -->
    <div class="menu-card">
      <h2>𝄢 ヘ音記号</h2>
      <div class="btn-grid">
        <button class="btn" onclick="startCourse('bass', 1)">Lv.1</button>
        <button class="btn" onclick="startCourse('bass', 2)">Lv.2</button>
        <button class="btn" onclick="startCourse('bass', 3)">Lv.3</button>
        <button class="btn" onclick="startCourse('bass', 4)">Lv.4</button>
        <button class="btn" onclick="startCourse('bass', 5)">Lv.5</button>
        <button class="btn" onclick="startCourse('bass', 6)">Lv.6</button>
        <button class="btn" onclick="startCourse('bass', 7)">Lv.7</button>
        <button class="btn" onclick="startCourse('bass', 8)">Lv.8</button>
      </div>
    </div>

  </div>

  <!-- スタート表紙画面 -->
  <div id="start-screen" class="game-screen">
    <button class="back-btn" onclick="showMenu()">🏠 メニューに戻る</button>
    <div class="start-wrapper" onclick="beginCards()">
      <img src="level_start.png" alt="レベルスタート">
      <div id="level-number-display" class="level-num-overlay">1</div>
      <div class="start-tap-hint">👆 タップしてスタート！</div>
    </div>
  </div>

  <!-- フラッシュカード画面 -->
  <div id="game-screen" class="game-screen">
    <button class="back-btn" onclick="showMenu()">🏠 メニューに戻る</button>

    <div class="card-wrapper" id="card-wrapper">
      <div class="image-container">
        <img id="card-image" src="" alt="音符カード" onerror="tryNextExt(this)">
        <div id="cover" class="cover-overlay">
          ❓ タップで答え合わせ＆音声再生
        </div>
      </div>
    </div>

    <audio id="card-audio" src=""></audio>

    <div class="swipe-hint">
      👆 1回目：タップ／スワイプで答えを表示＋音<br>
      👉 2回目：スワイプで次のカードへ
    </div>
  </div>

  <script>
    const courses = {
      'intro': ['t_c1', 'h_c1'],
      'treble': {
        1: ['t_c1', 't_d1', 't_e1'],
        2: ['t_f1', 't_g1', 't_a1', 't_b1'],
        3: ['t_c2', 't_d2', 't_e2'],
        4: ['t_f2', 't_g2', 't_a2'],
        5: ['t_c3', 't_d3'],
        6: ['t_a', 't_b', 't_e'],
        7: ['t_c1', 't_d1', 't_e1', 't_f1', 't_g1'],
        8: ['t_a', 't_a1', 't_a2', 't_b', 't_b1', 't_b2', 't_c1', 't_c2', 't_c3', 't_d1', 't_d2', 't_d3', 't_e', 't_e1', 't_e2', 't_e3', 't_f', 't_f1', 't_f2', 't_g', 't_g1', 't_g2']
      },
      'bass': {
        1: ['h_c1', 'h_d1', 'h_e1'],
        2: ['h_f1', 'h_g1', 'h_aRa1', 'h_bSi1'],
        3: ['h_cdo', 'h_d', 'h_e'],
        4: ['h_f', 'h_g', 'h_ara', 'h_bsi'],
        5: ['h_c00', 'h_d0', 'h_e0mi', 'h_f0', 'h_g0', 'h_a0', 'h_b0'],
        6: ['h_c1', 'h_d1', 'h_e1', 'h_f1', 'h_g1'],
        7: ['h_cdo', 'h_d', 'h_e', 'h_f', 'h_g'],
        8: ['h_a0', 'h_aRa1', 'h_ara', 'h_b0', 'h_bSi1', 'h_bsi', 'h_c00', 'h_c1', 'h_cdo', 'h_d', 'h_d0', 'h_d1', 'h_e', 'h_e0mi', 'h_e1', 'h_f', 'h_f0', 'h_f1', 'h_g', 'h_g0']
      }
    };

    let activeList = [];
    let currentIndex = 0;
    let isRevealed = false;
    let extAttempt = 0;

    function startCourse(type, level = null) {
      if (type === 'intro') {
        activeList = courses['intro'];
        document.getElementById('level-number-display').innerText = '1';
      } else {
        activeList = courses[type][level];
        document.getElementById('level-number-display').innerText = level;
      }

      document.getElementById('menu-screen').style.display = 'none';
      document.getElementById('start-screen').style.display = 'block';
    }

    function beginCards() {
      currentIndex = 0;
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';
      showCard(currentIndex);
    }

    function showMenu() {
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('menu-screen').style.display = 'flex';
    }

    function tryNextExt(imgElement) {
      const base = activeList[currentIndex];
      extAttempt++;
      if (extAttempt === 1) {
        imgElement.src = base + '.PNG';
      } else if (extAttempt === 2) {
        imgElement.src = base + '.PNG.png';
      }
    }

    function showCard(index) {
      const base = activeList[index];
      extAttempt = 0;
      
      document.getElementById('card-image').src = base + '.png';
      document.getElementById('card-audio').src = base + '.m4a';
      
      isRevealed = false;
      document.getElementById('cover').classList.remove('revealed');
    }

    function handleAction() {
      if (!isRevealed) {
        isRevealed = true;
        document.getElementById('cover').classList.add('revealed');
        playAudio();
      } else {
        nextCard();
      }
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % activeList.length;
      showCard(currentIndex);
    }

    function prevCard() {
      currentIndex = (currentIndex - 1 + activeList.length) % activeList.length;
      showCard(currentIndex);
    }

    function playAudio() {
      const audio = document.getElementById('card-audio');
      audio.play().catch(e => console.log("再生エラー:", e));
    }

    const wrapper = document.getElementById('card-wrapper');
    let startX = 0;
    let startY = 0;

    wrapper.addEventListener('click', () => {
      handleAction();
    });

    wrapper.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, false);

    wrapper.addEventListener('touchend', (e) => {
      let diffX = e.changedTouches[0].clientX - startX;
      let diffY = e.changedTouches[0].clientY - startY;

      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 30) {
        e.stopPropagation();
        if (diffX < 0) {
          handleAction();
        } else {
          prevCard();
        }
      }
    }, false);
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>おんぷカードでレベルアップ！</title>
  <style>
    :root {
      --bg-color: #fce4ec;
      --card-bg: #ffffff;
      --primary-color: #ff4081;
      --accent-color: #ff80ab;
      --text-color: #333333;
      --shadow: 0 8px 16px rgba(0,0,0,0.1);
      --border-radius: 20px;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 850px;
      background-color: var(--card-bg);
      box-shadow: var(--shadow);
      border-radius: var(--border-radius);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      position: relative;
    }

    .hidden {
      display: none !important;
    }

    h1, h2, h3 {
      text-align: center;
      color: #d81b60;
      margin: 10px 0;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 50px;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 12px 20px;
      transition: transform 0.1s, background-color 0.2s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button:active {
      transform: scale(0.95);
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }
    .btn-secondary {
      background-color: #e0e0e0;
      color: #333;
    }

    /* メニュー画面 */
    .profile-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8bbd0;
      padding: 10px 15px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .select-button {
      background-color: #fff;
      border: 3px solid #ff4081;
      color: #ff4081;
      border-radius: 15px;
      padding: 15px;
      font-size: 1.2rem;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }
    .select-button.special {
      background: linear-gradient(135deg, #ff80ab, #ff4081);
      color: white;
      border: none;
    }
    .select-button.accent {
      background: linear-gradient(135deg, #ffd54f, #ffb300);
      color: #fff;
      border: none;
    }
    .select-button.locked {
      background-color: #f1f1f1;
      border-color: #ccc;
      color: #aaa;
    }
    .lock-tag {
      font-size: 1.2rem;
    }

    /* 学習・トレーニング画面 */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .staff-card {
      background: #fff;
      border: 4px solid #ff80ab;
      border-radius: 20px;
      width: 100%;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    .grand-staff {
      width: 80%;
      height: 120px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .line {
      width: 100%;
      height: 2px;
      background-color: #555;
    }
    .staff-group {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 48px;
    }
    .note-object {
      position: absolute;
      font-size: 2.5rem;
      transition: all 0.2s;
      left: 45%;
    }

    /* 回答パッド */
    .answer-pad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: auto;
    }
    .ans-btn {
      background-color: #fff;
      border: 3px solid #ccc;
      border-radius: 12px;
      padding: 15px 0;
      font-size: 1.2rem;
      font-weight: bold;
      color: #555;
      text-align: center;
      box-shadow: 0 4px 0 #ccc;
    }
    .ans-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #ccc;
    }
    .ans-btn.do { border-color: #e53935; color: #e53935; box-shadow: 0 4px 0 #e53935; }
    .ans-btn.re { border-color: #fb8c00; color: #fb8c00; box-shadow: 0 4px 0 #fb8c00; }
    .ans-btn.mi { border-color: #fdd835; color: #fbc02d; box-shadow: 0 4px 0 #fbc02d; }
    .ans-btn.fa { border-color: #43a047; color: #43a047; box-shadow: 0 4px 0 #43a047; }
    .ans-btn.so { border-color: #00acc1; color: #00acc1; box-shadow: 0 4px 0 #00acc1; }
    .ans-btn.la { border-color: #1e88e5; color: #1e88e5; box-shadow: 0 4px 0 #1e88e5; }
    .ans-btn.ti { border-color: #8e24aa; color: #8e24aa; box-shadow: 0 4px 0 #8e24aa; }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      75% { transform: translateX(-10px); }
      100% { transform: translateX(0); }
    }
    .shake {
      animation: shake 0.3s ease-in-out;
    }

    .modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: var(--border-radius);
      text-align: center;
      width: 85%;
      max-width: 340px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .hanamaru {
      font-size: 5rem;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- 1. メニュー画面 -->
  <div id="menuScreen" class="screen">
    <div class="profile-bar">
      <span id="currentProfileName">プレイヤー: ちゃと</span>
      <button class="btn-secondary" style="padding: 5px 10px; font-size: 0.9rem;" onclick="switchProfile()">きりかえ</button>
    </div>

    <h1>🎵 おんぷカード</h1>

    <div class="menu-buttons">
      <button class="select-button special" onclick="startDoLesson()">🎵 6つの「ド」をおぼえよう！</button>
      <button class="select-button accent" onclick="startMonthlyChallenge()">🌟 今月のチャレンジ</button>
      <button class="select-button" onclick="showScoreScreen()">🏆 せいせき・ランキング</button>

      <button id="btnTreble" class="select-button" onclick="selectClef('treble')">
        ト音記号 <span id="lockTreble" class="lock-tag">🔒</span>
      </button>
      <button id="btnBass" class="select-button" onclick="selectClef('bass')">
        ヘ音記号 <span id="lockBass" class="lock-tag">🔒</span>
      </button>
      <button id="btnAll" class="select-button" onclick="selectClef('all')">
        全カード <span id="lockAll" class="lock-tag">🔒</span>
      </button>
    </div>
  </div>

  <!-- 2. トレーニング画面 -->
  <div id="gameScreen" class="screen hidden">
    <div class="game-header">
      <button class="btn-secondary" onclick="returnToMenu()" style="padding: 5px 15px; font-size: 0.9rem;">🏠 もどる</button>
      <span id="gameProgress">もんだい 1 / 10</span>
    </div>

    <div id="staffCardContainer" class="staff-card">
      <div class="grand-staff">
        <div class="staff-group">
          <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
        </div>
        <div class="staff-group">
          <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
        </div>
      </div>
      <div id="noteIcon" class="note-object">♩</div>
    </div>

    <div id="feedbackMark" style="text-align: center; font-size: 2rem; height: 40px; color: red; font-weight: bold;"></div>

    <div class="answer-pad">
      <button class="ans-btn do" onclick="checkAnswer('ド')">ド</button>
      <button class="ans-btn re" onclick="checkAnswer('レ')">レ</button>
      <button class="ans-btn mi" onclick="checkAnswer('ミ')">ミ</button>
      <button class="ans-btn fa" onclick="checkAnswer('ファ')">ファ</button>
      <button class="ans-btn so" onclick="checkAnswer('ソ')">ソ</button>
      <button class="ans-btn la" onclick="checkAnswer('ラ')">ラ</button>
      <button class="ans-btn ti" onclick="checkAnswer('シ')">シ</button>
      <button class="ans-btn" style="border-color:#78909c; color:#78909c;" onclick="passQuestion()">パス</button>
    </div>
  </div>

  <!-- 3. 結果・クリア画面モーダル -->
  <div id="resultModal" class="modal hidden">
    <div class="modal-content">
      <div id="resultHanamaruArea"></div>
      <h2 id="resultTitle">お疲れ様でした！</h2>
      <p id="resultText">正答率: 100%</p>
      <div id="encouragementText" style="margin: 8px 0; font-size: 0.95rem; color: #e91e63; font-weight: bold;"></div>
      <div id="resultSongInfo" style="margin: 10px 0; font-weight: bold; color: #d81b60;"></div>
      <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
        <button id="resultRetryBtn" class="btn-primary" onclick="retryGame()">もう一度やる</button>
        <button id="resultEndBtn" class="btn-secondary" onclick="returnToMenu()">終了</button>
      </div>
    </div>
  </div>

  <!-- 4. 成績・ランキング画面 -->
  <div id="scoreScreen" class="screen hidden">
    <div class="game-header">
      <button class="btn-secondary" onclick="returnToMenu()" style="padding: 5px 15px;">🏠 もどる</button>
      <h2>🏆 せいせき</h2>
    </div>
    <div style="background: #fff; padding: 15px; border-radius: 15px; margin-top: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
      <p>🕒 総練習時間: <span id="totalPracticeTime">0分 0秒</span></p>
      <p>⭐ 解放したコース: <span id="clearedLevelsCount">0</span> 個</p>
    </div>
  </div>

</div>

<script>
  /* --------------------------------
     初期化とデータリセット（スタート状態）
  -------------------------------- */
  // チェック用の初期化リセット（必要に応じて一度全クリアして初期構築）
  if (!localStorage.getItem("onpu_initialized_v2")) {
    localStorage.clear();
    localStorage.setItem("onpu_initialized_v2", "true");
  }

  let profiles = ["ちゃと", "くろ", "サブロー"];
  let activeProfileIndex = StorageGet("onpu_active_profile", 0);
  let unlockedLevels = StorageGet("onpu_unlocked", { treble: 0, bass: 0, all: 0 });

  let currentMode = "";
  let currentQuestions = [];
  let currentIndex = 0;
  let currentMistakes = 0;
  let totalPracticeSeconds = StorageGet("onpu_practice_seconds", 0);
  let previousAccuracy = StorageGet("onpu_prev_accuracy", -1);

  setInterval(() => {
    totalPracticeSeconds++;
    StorageSet("onpu_practice_seconds", totalPracticeSeconds);
  }, 1000);

  function StorageGet(key, defaultVal) {
    const val = localStorage.getItem(key);
    return val ? JSON.parse(val) : defaultVal;
  }
  function StorageSet(key, val) {
    localStorage.setItem(key, JSON.stringify(val));
  }

  window.onload = function() {
    updateProfileDisplay();
    updateMenuLocks();
  };

  function updateProfileDisplay() {
    document.getElementById("currentProfileName").textContent = `プレイヤー: ${profiles[activeProfileIndex]}`;
  }

  function switchProfile() {
    activeProfileIndex = (activeProfileIndex + 1) % profiles.length;
    StorageSet("onpu_active_profile", activeProfileIndex);
    updateProfileDisplay();
  }

  function updateMenuLocks() {
    const trebleBtn = document.getElementById("btnTreble");
    const bassBtn = document.getElementById("btnBass");
    const allBtn = document.getElementById("btnAll");

    if (unlockedLevels.treble > 0) {
      document.getElementById("lockTreble").textContent = "";
      trebleBtn.classList.remove("locked");
    } else {
      document.getElementById("lockTreble").textContent = "🔒";
      trebleBtn.classList.add("locked");
    }

    if (unlockedLevels.bass > 0) {
      document.getElementById("lockBass").textContent = "";
      bassBtn.classList.remove("locked");
    } else {
      document.getElementById("lockBass").textContent = "🔒";
      bassBtn.classList.add("locked");
    }

    if (unlockedLevels.all > 0) {
      document.getElementById("lockAll").textContent = "";
      allBtn.classList.remove("locked");
    } else {
      document.getElementById("lockAll").textContent = "🔒";
      allBtn.classList.add("locked");
    }
  }

  function returnToMenu() {
    document.querySelectorAll(".screen, .modal").forEach(el => el.classList.add("hidden"));
    document.getElementById("menuScreen").classList.remove("hidden");
    updateMenuLocks();
  }

  /* --------------------------------
     モード開始
  -------------------------------- */
  function startDoLesson() {
    currentMode = "do";
    currentQuestions = [
      { note: "ド", pos: 70 }, { note: "レ", pos: 60 },
      { note: "ミ", pos: 50 }, { note: "ファ", pos: 40 },
      { note: "ソ", pos: 30 }, { note: "ラ", pos: 20 }
    ];
    initGameSession();
  }

  function startMonthlyChallenge() {
    currentMode = "challenge";
    // 正しい「あき」のメロディ出題データ（ソ・ラ・シ・ド・ラ・ソ・ミ...等）
    currentQuestions = [
      { note: "ソ", pos: 30 }, { note: "ラ", pos: 20 }, { note: "シ", pos: 10 }, { note: "ド", pos: 70 },
      { note: "ラ", pos: 20 }, { note: "ソ", pos: 30 }, { note: "ミ", pos: 50 }, { note: "ファ", pos: 40 },
      { note: "ソ", pos: 30 }, { note: "レ", pos: 60 }, { note: "ミ", pos: 50 }, { note: "ド", pos: 70 }
    ];
    initGameSession();
  }

  function selectClef(type) {
    if (type === 'treble' && unlockedLevels.treble === 0) return;
    if (type === 'bass' && unlockedLevels.bass === 0) return;
    if (type === 'all' && unlockedLevels.all === 0) return;

    currentMode = type;
    currentQuestions = [
      { note: "ド", pos: 70 }, { note: "レ", pos: 60 }, { note: "ミ", pos: 50 },
      { note: "ファ", pos: 40 }, { note: "ソ", pos: 30 }, { note: "ラ", pos: 20 }
    ];
    initGameSession();
  }

  function initGameSession() {
    currentIndex = 0;
    currentMistakes = 0;
    document.getElementById("menuScreen").classList.add("hidden");
    document.getElementById("gameScreen").classList.remove("hidden");
    loadQuestion();
  }

  function loadQuestion() {
    if (currentIndex >= currentQuestions.length) {
      finishGameSession();
      return;
    }
    document.getElementById("gameProgress").textContent = `もんだい ${currentIndex + 1} / ${currentQuestions.length}`;
    document.getElementById("feedbackMark").textContent = "";
    const q = currentQuestions[currentIndex];
    const noteEl = document.getElementById("noteIcon");
    noteEl.style.top = `${q.pos}px`;
  }

  /* --------------------------------
     回答判定
  -------------------------------- */
  function checkAnswer(ans) {
    const q = currentQuestions[currentIndex];
    const feedbackEl = document.getElementById("feedbackMark");
    const staffCard = document.getElementById("staffCardContainer");

    if (ans === q.note) {
      playNoteSound(q.note);
      feedbackEl.textContent = "⭕";
      feedbackEl.style.color = "green";

      setTimeout(() => {
        currentIndex++;
        loadQuestion();
      }, 400);

    } else {
      currentMistakes++;
      // チャレンジモードでは音を鳴らさず×とブルブル演出のみ
      if (currentMode !== "challenge") {
        playNoteSound(ans);
      }
      feedbackEl.textContent = "❌";
      feedbackEl.style.color = "red";
      staffCard.classList.add("shake");
      setTimeout(() => {
        staffCard.classList.remove("shake");
      }, 300);
      // 間違えた場合は進まずその場でキープ
    }
  }

  function passQuestion() {
    currentIndex++;
    loadQuestion();
  }

  /* --------------------------------
     音声再生用 (Web Audio API)
  -------------------------------- */
  function playNoteSound(note) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      
      const freqs = { "ド": 261.63, "レ": 293.66, "ミ": 329.63, "ファ": 349.23, "ソ": 392.00, "ラ": 440.00, "シ": 493.88 };
      osc.frequency.setValueAtTime(freqs[note] || 440, ctx.currentTime);
      
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.4);
    } catch(e) {}
  }

  function playTasseiFanfare() {
    try {
      const audio = new Audio("Tassei-fanfare.mp3");
      audio.play().catch(e => {});
    } catch(e) {}
  }

  /* --------------------------------
     ゲーム終了・結果演出
  -------------------------------- */
  function finishGameSession() {
    const modal = document.getElementById("resultModal");
    const titleEl = document.getElementById("resultTitle");
    const textEl = document.getElementById("resultText");
    const songInfoEl = document.getElementById("resultSongInfo");
    const hanamaruArea = document.getElementById("resultHanamaruArea");
    const encEl = document.getElementById("encouragementText");

    modal.classList.remove("hidden");
    hanamaruArea.innerHTML = "";
    songInfoEl.textContent = "";
    encEl.textContent = "";

    let accuracy = Math.floor(((currentQuestions.length - currentMistakes) / currentQuestions.length) * 100);
    if (accuracy < 0) accuracy = 0;

    // 励ましコメントの判定
    if (previousAccuracy !== -1) {
      if (accuracy > previousAccuracy) {
        encEl.textContent = "✨ すごーい！ まえより せいとうりつが アップしたよ！ そのちょうし！";
      } else if (accuracy === 100) {
        encEl.textContent = "👑 かんぺき！ てんさいピアニストだね！";
      } else {
        encEl.textContent = "💪 つぎは もっと できるよ！ がんばろう！";
      }
    } else {
      encEl.textContent = "🌟 はじめてのチャレンジ、よくがんばったね！";
    }
    previousAccuracy = accuracy;
    StorageSet("onpu_prev_accuracy", accuracy);

    if (currentMode === "challenge") {
      if (accuracy === 100) {
        hanamaruArea.innerHTML = '<div class="hanamaru">💮</div>';
        playTasseiFanfare();
        titleEl.textContent = "おめでとう！";
        textEl.textContent = `正答率: ${accuracy}%`;
        songInfoEl.textContent = "今月のチャレンジ曲は『秋』でした！";

        // 自動演奏の実行
        playSongAutoMelody(currentQuestions);

        if (unlockedLevels.treble === 0) {
          unlockedLevels.treble = 1;
          StorageSet("onpu_unlocked", unlockedLevels);
        }
      } else {
        titleEl.textContent = "もう一度チャレンジしてね";
        textEl.textContent = `正答率: ${accuracy}%`;
      }
    } else {
      titleEl.textContent = "よくできました！";
      textEl.textContent = `正答率: ${accuracy}%`;
      if (accuracy >= 90 && unlockedLevels.bass === 0) {
        unlockedLevels.bass = 1;
        StorageSet("onpu_unlocked", unlockedLevels);
        playTasseiFanfare();
      }
    }
  }

  function playSongAutoMelody(questions) {
    questions.forEach((q, idx) => {
      setTimeout(() => {
        playNoteSound(q.note);
      }, idx * 400 + 800);
    });
  }

  function retryGame() {
    document.getElementById("resultModal").classList.add("hidden");
    if (currentMode === "challenge") {
      startMonthlyChallenge();
    } else if (currentMode === "do") {
      startDoLesson();
    } else {
      selectClef(currentMode);
    }
  }

  function showScoreScreen() {
    document.getElementById("menuScreen").classList.add("hidden");
    document.getElementById("scoreScreen").classList.remove("hidden");

    const mins = Math.floor(totalPracticeSeconds / 60);
    const secs = totalPracticeSeconds % 60;
    document.getElementById("totalPracticeTime").textContent = `${mins}分 ${secs}秒`;

    let count = 0;
    if (unlockedLevels.treble > 0) count++;
    if (unlockedLevels.bass > 0) count++;
    if (unlockedLevels.all > 0) count++;
    document.getElementById("clearedLevelsCount").textContent = count;
  }
</script>

</body>
</html>

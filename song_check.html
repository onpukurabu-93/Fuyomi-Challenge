<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>きょく かくにん（せんせい用）</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#fdf8ed;color:#5b4636;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
#app{max-width:460px;margin:0 auto;padding:14px 12px 40px}
h1{font-size:19px;margin:6px 0 2px;text-align:center}
.sub{font-size:12px;color:#806c5a;text-align:center;margin-bottom:10px;line-height:1.6}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{flex:1 1 auto;border:2px solid #eadcc8;border-radius:12px;padding:9px 6px;font-size:13px;font-weight:800;background:#fff;color:#5b4636}
.tabs button.on{background:#ffd54f;border-color:#ff9800}
.btns{display:flex;gap:8px;margin:10px 0}
.btns button{flex:1;border:none;border-radius:12px;padding:14px 6px;font-size:16px;font-weight:800;color:#fff;background:#ff7043}
.btns .s2{background:#78a9c8}
.bar{background:#fff;border-radius:12px;padding:8px 10px;margin:8px 0;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.bn{font-size:11px;color:#9a8672;margin-bottom:4px}
.notes{display:flex;flex-wrap:wrap;gap:6px}
.n{min-width:42px;text-align:center;padding:7px 4px 5px;border-radius:10px;background:#fdf8ed;border:2px solid #eadcc8;font-size:19px;font-weight:900;line-height:1.1}
.n small{display:block;font-size:10px;font-weight:700;color:#9a8672;margin-top:2px}
.n.on{background:#ffd54f;border-color:#ff9800;transform:scale(1.12)}
.hint{font-size:12px;line-height:1.7;background:#fff3cd;border-radius:10px;padding:8px 10px;margin-top:12px}
</style></head><body><div id="app">
<h1>きょく かくにん</h1>
<div class="sub">せんせい用：楽譜から よみとった おとが ただしいか、<br>きいて、みて たしかめるページです</div>
<div class="tabs" id="tabs"></div>
<div class="btns"><button id="play">▶ きく</button><button id="stop" class="s2">■ とめる</button></div>
<div id="bars"></div>
<div class="hint">・みどころ：①1小節ごとの おとの ならび ②ひくい／たかい の ちがい（ド↓＝ト音記号の 下の ド、ド↑＝ごせんの 中の ド）<br>
・小節の ばんごうは、楽譜に かいてある 小節の ばんごうです（ひとつめの 小節が1）。<br>
・「2」「4」は、おとの あとの きゅうふ（おやすみ）もふくめた ながさです。</div>
</div>
<script src="songs_data.js"></script>
<script>
(function(){
var NAMES=["ミ","ファ","ソ","ラ","シ","ド","レ"],OFFS=[0,1,3,5,7,8,10];
function nameOf(n){var b=NAMES[((n%7)+7)%7];if(n===-2)return"ド↓";if(n===5)return"ド↑";if(n===12)return"ド↑↑";if(n===-3)return"シ↓";if(n===-4)return"ラ↓";if(n===-9)return"ド";return b}
function midiOf(n){return 64+12*Math.floor(n/7)+OFFS[((n%7)+7)%7]}
var cur=0,ctx=null,timers=[];
function build(){
 var t=document.getElementById("tabs");t.innerHTML="";
 CHECK_SONGS.forEach(function(s,i){var b=document.createElement("button");b.textContent=s.title;b.className=i===cur?"on":"";b.onclick=function(){stop();cur=i;build()};t.appendChild(b)});
 var box=document.getElementById("bars");box.innerHTML="";
 CHECK_SONGS[cur].bars.forEach(function(bar,bi){
  var d=document.createElement("div");d.className="bar";d.innerHTML='<div class="bn">'+(bi+1)+'つめの 小節</div><div class="notes"></div>';
  bar.forEach(function(q,qi){var e=document.createElement("div");e.className="n";e.id="n_"+bi+"_"+qi;e.innerHTML=nameOf(q[0])+"<small>"+q[1]+"</small>";d.lastChild.appendChild(e)});
  box.appendChild(d)});
}
function stop(){timers.forEach(clearTimeout);timers=[];Array.prototype.forEach.call(document.querySelectorAll(".n.on"),function(e){e.classList.remove("on")})}
function tone(f,t,dur){
 var m=ctx.createGain(),hold=Math.max(dur*1.4,.6);m.gain.setValueAtTime(.0001,t);m.gain.exponentialRampToValueAtTime(.45,t+.008);m.gain.exponentialRampToValueAtTime(.0001,t+hold);m.connect(ctx.destination);
 [[1,1],[2,.45],[3,.2],[4,.1]].forEach(function(h){var o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=f*h[0];g.gain.value=h[1]*.5;o.connect(g);g.connect(m);o.start(t);o.stop(t+hold+.05)})}
document.getElementById("play").onclick=function(){
 stop();var AC=window.AudioContext||window.webkitAudioContext;if(!ctx)ctx=new AC();if(ctx.state!=="running")ctx.resume();
 var s=CHECK_SONGS[cur],t=ctx.currentTime+.15,t0=t;
 s.bars.forEach(function(bar,bi){bar.forEach(function(q,qi){
  var dur=q[1]*s.beat;tone(440*Math.pow(2,(midiOf(q[0])-69)/12),t,dur);
  (function(id,at){timers.push(setTimeout(function(){var e=document.getElementById(id);if(e){Array.prototype.forEach.call(document.querySelectorAll(".n.on"),function(x){x.classList.remove("on")});e.classList.add("on");e.scrollIntoView({block:"center",behavior:"smooth"})}},(at-t0+.15)*1000))})("n_"+bi+"_"+qi,t);
  t+=dur})})};
document.getElementById("stop").onclick=stop;
build();
})();
</script></body></html>
